# Debezium PostgreSQL Connector Configuration
# Matches the managed connector defined in IaC/connector/connector.tf
# Tables: public.accounts, public.customers, public.transactions

name=postgres-cdc
connector.class=io.debezium.connector.postgresql.PostgresConnector

# Database connection (local PostgreSQL container)
database.hostname=localhost
database.port=5432
database.user=dbadmin
database.password=localdevonly
database.dbname=c360db

# Replication setup
database.server.name=postgres-cdc
plugin.name=pgoutput
database.publication.name=debezium_pub
database.slot.name=debezium_slot

# Table selection
table.include.list=public.accounts,public.customers,public.transactions

# Output format and encoding (matches managed connector: AVRO)
output.key.format=avro
output.value.format=avro
key.converter=io.confluent.connect.avro.AvroConverter
value.converter=io.confluent.connect.avro.AvroConverter
key.converter.schema.registry.url=https://psrc-13go8y7.us-west-2.aws.confluent.cloud
value.converter.schema.registry.url=https://psrc-13go8y7.us-west-2.aws.confluent.cloud
key.converter.schemas.enable=true
value.converter.schemas.enable=true

# CDC options
snapshot.mode=initial
decimal.handling.mode=string
tombstones.on.delete=true
include.unknown.datatypes=true

# Topic naming (matches managed connector with "cdc" prefix)
topic.prefix=cdc
transforms=route
transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
transforms.route.regex=([^.]+)\\.([^.]+)\\.([^.]+)
transforms.route.replacement=${1}-${2}-${3}

# Offset storage (in-memory for dev; use Kafka for production)
offset.storage=org.apache.kafka.connect.storage.MemoryOffsetBackingStore
offset.flush.interval.ms=0

# Performance tuning
max.batch.size=2048
poll.interval.ms=1000
