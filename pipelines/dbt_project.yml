
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'streamhouse'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'j9r'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]


clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
#
# Route each data product to its own Flink compute pool so pipeline cost can be
# attributed per product: c360 -> FLINK_COMPUTE_POOL_ID, crm ->
# FLINK_CRM_COMPUTE_POOL_ID (both set in the terminal session, e.g. by
# scripts/set_env_from_tf.sh). Declared explicitly per folder (not via the
# profile default) so the mapping is visible and symmetric, and set at folder
# level (not per-model config()) so it serializes reliably into each model's
# config in manifest.json, which the descriptor builder reads to stamp
# compute_pool_id on each node.
models:
  streamhouse:
    c360:
      +compute_pool_id: "{{ env_var('FLINK_COMPUTE_POOL_ID') }}"
    crm:
      +compute_pool_id: "{{ env_var('FLINK_CRM_COMPUTE_POOL_ID') }}"


# Reference data (ISO 3166-1 countries, ISO 4217 currencies). `dbt seed` creates
# one Kafka topic + Flink table per CSV and inserts the rows, so they can be
# joined with the transaction/customer streams. Numeric ISO codes keep their
# leading zeros (e.g. 008, 020), so force every column to STRING.
seeds:
  streamhouse:
    country_codes:
      +column_types:
        country_code: string
        country_code_alpha3: string
        country_code_numeric: string
        country_name: string
    currency_codes:
      +column_types:
        currency_code: string
        currency_code_numeric: string
        currency_name: string
