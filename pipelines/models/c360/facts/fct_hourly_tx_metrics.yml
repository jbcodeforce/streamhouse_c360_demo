models:
- name: fct_hourly_tx_metrics
  description: ""
  constraints:
  - type: primary_key
    columns: [account_id, window_start, window_end]
    expression: "NOT ENFORCED"
  columns:
  - name: account_id
    data_type: string
  - name: window_start
    data_type: TIMESTAMP_LTZ(3)
  - name:   window_end
    data_type: TIMESTAMP_LTZ(3)
  - name:   window_type
    data_type: STRING
  - name:   tx_count
    data_type: BIGINT
  - name:   total_amount
    data_type:  DECIMAL(10, 2)
  - name:   avg_amount
    data_type:  DECIMAL(10, 2)
  - name:   min_amount
    data_type: DECIMAL(10, 2)
  - name:   max_amount
    data_type:  DECIMAL(10, 2)