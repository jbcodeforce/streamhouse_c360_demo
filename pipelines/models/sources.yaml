version: 2
sources:
- name: cdc
  schema: "{{ env_var('KAFKA_CLUSTER_NAME') }}"
  tables:
  - name: customers
    identifier: cdc.public.customers
    description: >
      Raw CDC changelog stream for the customers table — captures INSERT,
      UPDATE, and DELETE operations for every customer record as they
      occur in the operational database.
  - name: accounts
    identifier: cdc.public.accounts
    description: >
      Raw CDC changelog stream for the accounts table — captures INSERT,
      UPDATE, and DELETE operations for every account record as they occur
      in the operational database.
  - name: transactions
    identifier: cdc.public.transactions
    description: >
      Raw CDC changelog stream for the transactions table — captures all
      transaction events (INSERT, UPDATE, DELETE) from the operational
      database.
  - name: cards
    identifier: cdc.public.cards
    description: >
      Raw CDC changelog stream for the cards table — captures INSERT,
      UPDATE, and DELETE operations for every card record as they occur
      in the operational database.
