models:
- name: src_cards
  description: "Cleaned cards"
  constraints:
    - type: custom
      expression: "WATERMARK FOR created_at AS created_at - INTERVAL '5' SECOND"
  columns:
  - name: card_id
    data_type: string
    constraints:
      - type: not_null
      - type: primary_key
        expression: "not enforced"
  - name: account_id
    data_type: string
  - name: card_number
    data_type: string
  - name: card_brand
    data_type: string
  - name: card_type
    data_type: string
  - name: has_chip
    data_type: boolean
  - name: credit_limit
    data_type: decimal(18, 2)
  - name: created_at
    data_type: timestamp_ltz(3)

