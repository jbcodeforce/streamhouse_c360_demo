# C360 demo stack on a single host: nginx (SPA + /api reverse proxy) -> FastAPI backend.
#
# Run from this directory (the EC2 boot script does this):
#   docker compose up -d --build
#
# Only the frontend is published (host :80). The backend is reachable solely on
# the compose network. Backend settings come from BACKEND_ENV_FILE (default
# ./backend.env, generated at boot from AWS Secrets Manager, mode 600, never in git).

services:
  backend:
    build:
      context: ../apps/backend
    env_file:
      - path: ${BACKEND_ENV_FILE:-./backend.env}
        format: raw # no $-interpolation of secret values
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No read_only: the backend appends to its seed CSV files under /opt/app-root/src.
    expose:
      - "8000"

  frontend:
    build:
      context: ../apps/frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "80:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lib/nginx/tmp
      - /var/log/nginx
    depends_on:
      - backend
