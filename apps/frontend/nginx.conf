# Server-level snippet included by the UBI nginx default server (port 8080).
# The SPA is served from the default root (/opt/app-root/src).

# Reverse-proxy the API to the backend service on the compose network.
# Docker's embedded DNS + a variable make nginx resolve "backend" per request, so
# nginx starts even if the backend container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
}

# Single-page app history fallback.
location / {
    try_files $uri $uri/ /index.html;
}

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
